<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nola — Suporte</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #17191d;
      --surface2: #1e2126;
      --border: #2a2d35;
      --accent: #ff5c3a;
      --accent2: #ff8a6e;
      --text: #f0f0f0;
      --text-muted: #7a7f8e;
      --bot-bubble: #1e2126;
      --user-bubble: #ff5c3a;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Subtle background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(255,92,58,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 10% 90%, rgba(255,92,58,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
      height: 100%;
      max-height: 820px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,92,58,0.08);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-info { flex: 1; }

    .header-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #3ecf8e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      background: rgba(255,92,58,0.1);
      border: 1px solid rgba(255,92,58,0.2);
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Message bubbles */
    .message {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .bot-avatar {
      background: var(--accent);
      color: #fff;
    }

    .user-avatar {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 400;
    }

    .bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    /* Timestamp */
    .timestamp {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
      font-family: var(--mono);
    }

    .message.user .timestamp { text-align: right; }

    .msg-inner { display: flex; flex-direction: column; }
    .message.user .msg-inner { align-items: flex-end; }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typingBounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-5px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(255,92,58,0.5);
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
    }

    .input-row input::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    .send-btn:hover { background: var(--accent2); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }

    .send-btn svg { width: 16px; height: 16px; fill: #fff; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
      font-family: var(--mono);
    }

    /* Quick suggestions */
    .suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .suggestion-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255,92,58,0.05);
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="header-logo">🍽️</div>
    <div class="header-info">
      <div class="header-name">Nola Suporte</div>
      <div class="header-status">
        <div class="status-dot"></div>
        <span class="status-text">Online agora</span>
      </div>
    </div>
    <div class="header-tag">IA</div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="message bot">
      <div class="avatar bot-avatar">🍽️</div>
      <div class="msg-inner">
        <div class="bubble">Olá! Sou o assistente de suporte da <strong>Nola</strong>. Como posso te ajudar hoje? 👋</div>
        <div class="timestamp">agora</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="suggestions" id="suggestions">
      <button class="suggestion-btn" onclick="useSuggestion(this)">Como emitir relatório?</button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">Problema com impressora</button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">Integração com iFood</button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">Esqueci minha senha</button>
    </div>
    <div class="input-row">
      <input
        type="text"
        id="userInput"
        placeholder="Digite sua dúvida..."
        onkeydown="if(event.key==='Enter') sendMessage()"
        autocomplete="off"
      />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">powered by Groq · N8N · Google Sheets</div>
  </div>

</div>

<script>
  const WEBHOOK_URL = 'https://sanlibayer.app.n8n.cloud/webhook/chatbot-nola';

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');
  const suggestionsEl = document.getElementById('suggestions');

  function getTime() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, sender) {
    const isUser = sender === 'user';
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerHTML = `
      ${!isUser ? `<div class="avatar bot-avatar">🍽️</div>` : ''}
      <div class="msg-inner">
        <div class="bubble">${text}</div>
        <div class="timestamp">${getTime()}</div>
      </div>
      ${isUser ? `<div class="avatar user-avatar">👤</div>` : ''}
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot typing';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar bot-avatar">🍽️</div>
      <div class="msg-inner">
        <div class="bubble">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function useSuggestion(btn) {
    inputEl.value = btn.textContent;
    suggestionsEl.style.display = 'none';
    sendMessage();
  }

  async function sendMessage() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    suggestionsEl.style.display = 'none';
    inputEl.value = '';
    sendBtn.disabled = true;

    addMessage(msg, 'user');
    showTyping();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });

      const data = await res.json();
      removeTyping();
      addMessage(data.resposta || 'Não consegui processar sua dúvida. Tente novamente.', 'bot');
    } catch (err) {
      removeTyping();
      addMessage('Ops! Não consegui me conectar ao servidor. Verifique se o workflow está ativo no N8N.', 'bot');
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>

</body>
</html>
